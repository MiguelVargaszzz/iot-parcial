# Telegraf: se suscribe al broker MQTT y guarda cada mensaje en InfluxDB
[agent]
  interval = "10s"
  flush_interval = "5s"
  omit_hostname = true

[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["unab/+/data"]
  qos = 1
  username = "${MQTT_USER}"
  password = "${MQTT_PASS}"
  client_id = "telegraf-ingesta"
  topic_tag = ""
  data_format = "json"
  tag_keys = ["device", "type"]
  name_override = "iot"

[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "${INFLUX_TOKEN}"
  organization = "${INFLUX_ORG}"
  bucket = "${INFLUX_BUCKET}"
